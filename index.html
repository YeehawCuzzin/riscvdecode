<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>riscvdecode</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>riscvdecode</h1>
    <hr />

    <label for="instruction">Enter a 32-bit RISC-V instruction:</label>
    <input
      id="instruction"
      type="text"
      placeholder="Example: 00000000000100010000000010010011"
      maxlength="40"
    />

    <div class="buttons">
      <button id="decodeBtn">Decode</button>
      <button id="clearBtn">Clear</button>
    </div>

    <pre id="output">Output will appear here.</pre>
  </main>

  <script src="script.js"></script>
</body>
</html>
